name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loyalty_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loyalty_test
      TEST_APP_DATABASE_URL: postgres://app_user:app_user@localhost:5432/loyalty_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm via Corepack
        run: corepack enable

      - name: Create test database
        run: psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE loyalty_test;"
        env:
          PGPASSWORD: postgres

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run migrations
        run: pnpm --filter @loyalty/db migrate

      - name: Run tests
        run: pnpm -r --if-present test
