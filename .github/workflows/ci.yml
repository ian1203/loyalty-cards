name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/loyalty_test
      APP_DATABASE_URL: postgres://app_user:app_user@localhost:5432/loyalty_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loyalty_test
      TEST_APP_DATABASE_URL: postgres://app_user:app_user@localhost:5432/loyalty_test

    steps:
      - uses: actions/checkout@v4

      # Tiene que ir ANTES de setup-node: cache: pnpm de ese paso invoca el
      # binario `pnpm` para resolver rutas de caché, y sin corepack habilitado
      # todavía no existe en el PATH del runner.
      - name: Enable pnpm via Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Create test database
        run: psql "postgres://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE loyalty_test;"
        env:
          PGPASSWORD: postgres

      # El contenedor postgres:16 es Postgres puro — no es un proyecto
      # Supabase real, así que no trae el schema `auth` ni el rol
      # `supabase_auth_admin` que Supabase aprovisiona automáticamente en
      # todo proyecto (ver el comentario de 0010_supabase_auth_bridge.sql:
      # "auth.users, tabla que Supabase crea — nuestras migraciones nunca
      # la tocan"). Esa migración asume que ambos ya existen — cierto en
      # local (Supabase CLI) y en producción (Supabase hosted), falso en
      # este contenedor pelón. Se stubea acá lo mínimo indispensable para
      # que las migraciones corran (una tabla con la PK que la FK
      # necesita, no una réplica de GoTrue) — nunca en los archivos de
      # migración, que deben seguir asumiendo la realidad de un Supabase
      # real, no la de este workaround de CI.
      - name: Stub del schema auth de Supabase (solo CI, Postgres puro)
        run: |
          psql "postgres://postgres:postgres@localhost:5432/loyalty_test" <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id uuid PRIMARY KEY DEFAULT gen_random_uuid()
          );
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'supabase_auth_admin') THEN
              CREATE ROLE supabase_auth_admin;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated;
            END IF;
          END
          $$;
          SQL
        env:
          PGPASSWORD: postgres

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm --filter @loyalty/web lint

      - name: Run migrations
        run: pnpm --filter @loyalty/db migrate

      - name: Run tests
        run: pnpm -r --if-present test
