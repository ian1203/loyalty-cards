name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Los valores de abajo son los mismos que .env.example (ya commiteado):
    # DATABASE_URL/APP_DATABASE_URL apuntan al puerto 54322 (Postgres real
    # de `supabase start`, no un postgres:16 suelto) y los tres NEXT_PUBLIC_*/
    # SUPABASE_SERVICE_ROLE_KEY son las claves JWT DEMO fijas que Supabase
    # CLI genera siempre para el mismo JWT_SECRET local por default — no son
    # secretos reales, son idénticas en cualquier `supabase start` de
    # cualquier máquina (confirmado contra `supabase status` en local). Dev
    # y test comparten la misma base `postgres`, igual que en local (ver el
    # comentario de .env.example) — nunca una `loyalty_test` aparte.
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      APP_DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      TEST_APP_DATABASE_URL: postgresql://app_user:app_user@127.0.0.1:54322/postgres

    steps:
      - uses: actions/checkout@v4

      # Tiene que ir ANTES de setup-node: cache: pnpm de ese paso invoca el
      # binario `pnpm` para resolver rutas de caché, y sin corepack habilitado
      # todavía no existe en el PATH del runner.
      - name: Enable pnpm via Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Reemplaza al postgres:16 suelto + stub manual del schema auth que
      # había antes: ESE Postgres no tenía GoTrue real, así que cualquier
      # test que hiciera login real (signInWithPassword/admin.createUser —
      # la mayoría de apps/web/tests, ver el comentario en
      # apps/web/vitest.config.ts) fallaba con NEXT_PUBLIC_SUPABASE_URL
      # apuntando a la nada. `supabase start` levanta el mismo stack que
      # local dev (mismo supabase/config.toml, mismos puertos) — real Auth,
      # no un stub. -x excluye contenedores que este proyecto no usa
      # (storage/realtime/imgproxy/mailpit/studio/analytics/pooler, ver
      # CLAUDE.md: sin esas features) para no pagar su arranque en CI;
      # kong/gotrue/postgrest/postgres se quedan porque SÍ se usan.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: supabase start (Postgres + Auth real, igual que local)
        run: supabase start --yes -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm --filter @loyalty/web lint

      - name: Run migrations
        run: pnpm --filter @loyalty/db migrate

      - name: Run tests
        run: pnpm -r --if-present test
